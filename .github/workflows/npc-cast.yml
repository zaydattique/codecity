name: CodeCity six civilian art candidates
on:
  push:
    branches: [main]
    paths:
      - 'art/characters.json'
      - 'tools/build_character.py'
      - '.github/workflows/npc-cast.yml'
  pull_request:
    branches: [main]
    paths:
      - 'art/characters.json'
      - 'tools/build_character.py'
      - '.github/workflows/npc-cast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id: ${{ fromJSON(github.event_name == 'pull_request' && '["jules","rhea","vincent","farah","theo","iris"]' || '["nora","omar","elena","marcus","sana","liam","jules","rhea","vincent","farah","theo","iris"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makehumancommunity/mpfb2
          ref: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a
          path: references/mpfb2
          persist-credentials: false
      - name: Build and install pinned MPFB extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb-package"
          blender --command extension build --source-dir references/mpfb2/src/mpfb --output-dir "$RUNNER_TEMP/mpfb-package"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/mpfb-package/"*.zip)
          test "${#packages[@]}" -eq 1
          blender --command extension install-file --repo user_default --enable "${packages[0]}"
      - name: Download official CC0 system pack
        run: |
          set -euo pipefail
          python tools/fetch_system_pack.py "$RUNNER_TEMP/system-assets.zip"
          sha256sum "$RUNNER_TEMP/system-assets.zip"
      - name: Build distinct authored adult candidate
        env:
          CHARACTER: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p build/characters build/npc-motion
          blender --background --disable-autoexec --python-exit-code 1 --python tools/build_character.py -- --id "$CHARACTER" --pack "$RUNNER_TEMP/system-assets.zip" 2>&1 | tee build/characters/build.log
          grep -q CODECITY_CHARACTER_CANDIDATE_OK build/characters/build.log
          curl -fL --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --max-filesize 8000000 https://raw.githubusercontent.com/webgl-games/opencity/ba9514cdd88ecc2d40ecad503a644449fc98e665/assets/characters/UAL1_Standard.glb -o build/npc-motion/UAL1_Standard.glb
          python tools/freeze_character_morphs.py "build/characters/$CHARACTER/$CHARACTER.glb" build/npc-motion/frozen.glb
          python -m tools.retarget_motion build/npc-motion/UAL1_Standard.glb build/npc-motion/frozen.glb "build/characters/$CHARACTER/runtime.glb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npc-${{ matrix.id }}-candidate
          path: |
            build/characters/build.log
            build/characters/${{ matrix.id }}/*.blend
            build/characters/${{ matrix.id }}/*.glb
            build/characters/${{ matrix.id }}/*.png
            build/characters/${{ matrix.id }}/*.json
          if-no-files-found: error
          retention-days: 7
