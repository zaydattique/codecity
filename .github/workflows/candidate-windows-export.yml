name: Shared Windows candidate export
on:
  workflow_call:
    inputs:
      project_artifact:
        required: true
        type: string
      suite:
        required: true
        type: string
      exe:
        required: true
        type: string
      output_artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-export:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CANDIDATE_SUITE: ${{ inputs.suite }}
      CANDIDATE_EXE: ${{ inputs.exe }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.project_artifact }}
          path: build/input
      - name: Stage tested project
        run: |
          tar -xzf build/input/tested-project.tar.gz -C build
          if ($LASTEXITCODE -ne 0) { throw "Extraction failed" }
          New-Item -Force -ItemType Directory build/windows-logs | Out-Null
      - name: Install pinned Windows editor and export templates
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP/godot.zip"
          curl.exe -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip -o $zip
          if ($LASTEXITCODE -ne 0) { throw "Godot download failed" }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953") { throw "Editor hash mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP/godot"
          $template = "$env:RUNNER_TEMP/templates.tpz"
          curl.exe -fsSL --retry 2 --max-time 900 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o $template
          if ($LASTEXITCODE -ne 0) { throw "Template download failed" }
          if ((Get-FileHash $template -Algorithm SHA256).Hash.ToLowerInvariant() -ne "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011") { throw "Template hash mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($template)
          try {
            $target = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
            New-Item -Force -ItemType Directory $target | Out-Null
            foreach ($name in @("windows_release_x86_64.exe","windows_debug_x86_64.exe")) {
              $entry = $archive.Entries | Where-Object { $_.FullName -eq "templates/$name" } | Select-Object -First 1
              if (!$entry) { throw "Missing pinned template $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$target/$name", $true)
            }
          } finally { $archive.Dispose() }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: inputs.suite == 'academy' || inputs.suite == 'integrated'
        with:
          python-version: '3.14.10'
      - name: Bundle standalone Python runtime and verify it
        if: inputs.suite == 'academy' || inputs.suite == 'integrated'
        run: |
          $ErrorActionPreference = 'Stop'
          # Copy the pinned CPython interpreter, standard library and native
          # modules only. Exclude pip/site-packages, tests and development tools.
          $base = python -c "import sys; print(sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { throw "Python discovery failed" }
          $target = (New-Item -Force -ItemType Directory build/distribution/python).FullName
          Copy-Item "$base/python.exe" $target
          Copy-Item "$base/python*.dll" $target
          Get-ChildItem "$base/vcruntime*.dll" | Copy-Item -Destination $target
          Copy-Item "$base/DLLs" $target -Recurse
          Copy-Item "$base/Lib" $target -Recurse
          foreach ($name in @("site-packages","test","ensurepip","idlelib","tkinter","turtledemo")) {
            $unused=Join-Path "$target/Lib" $name
            if (Test-Path $unused) { Remove-Item -Recurse -Force $unused }
          }
          $license=Join-Path $base "LICENSE.txt"
          if (!(Test-Path $license)) { throw "Python license missing" }
          Copy-Item $license build/distribution/Python-LICENSE.txt
          & "$target/python.exe" -I -S -c "import ast,json,sys; print(sys.version); assert sys.version_info[:3]==(3,14,10)"
          if ($LASTEXITCODE -ne 0) { throw "Copied Python runtime failed" }
      - name: Windows actual physics regression and export
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (!$godot) { throw "Missing editor console" }
          & $godot.FullName --headless --path build/game --editor --import 2>&1 | Tee-Object build/windows-logs/import.log
          if ($LASTEXITCODE -ne 0) { throw "Windows import failed" }
          if ($env:CANDIDATE_SUITE -notin @("street","vehicle","academy","integrated")) { throw "Unknown verification suite" }
          if ($env:CANDIDATE_EXE -notin @("CodeCity_Street_Test.exe","CodeCity_Driving_Test.exe","CodeCity_Academy_Demo.exe","CodeCity.exe")) { throw "Unknown candidate executable name" }
          & $godot.FullName --headless --path build/game --script res://_qa/street_playtest.gd -- --motion 2>&1 | Tee-Object build/windows-logs/physics.log
          if ($LASTEXITCODE -ne 0) { throw "Windows candidate physics failed" }
          if (!(Select-String -Path build/windows-logs/physics.log -SimpleMatch CODECITY_STREET_PLAYTEST_OK)) { throw "Physics marker absent" }
          if ($env:CANDIDATE_SUITE -in @("vehicle","academy","integrated")) {
            & $godot.FullName --headless --path build/game --script res://_qa/vehicle_playtest.gd 2>&1 | Tee-Object build/windows-logs/vehicle.log
            if ($LASTEXITCODE -ne 0 -or !(Select-String -Path build/windows-logs/vehicle.log -SimpleMatch CODECITY_VEHICLE_PLAYTEST_OK)) { throw "Native Windows vehicle check failed" }
          }
          if ($env:CANDIDATE_SUITE -in @("academy","integrated")) {
            $env:CODECITY_ACADEMY_SCRIPT=(Resolve-Path build/distribution/academy.py).Path
            $env:CODECITY_PYTHON=(Resolve-Path build/distribution/python/python.exe).Path
            & $godot.FullName --headless --path build/game --script res://_qa/academy_playtest.gd 2>&1 | Tee-Object build/windows-logs/academy.log
            if ($LASTEXITCODE -ne 0 -or !(Select-String -Path build/windows-logs/academy.log -SimpleMatch CODECITY_ACADEMY_PLAYTEST_OK)) { throw "Native Windows Python lesson failed" }
          }
          if ($env:CANDIDATE_SUITE -eq "integrated") {
            $env:CODECITY_NPC_SCRIPT=(Resolve-Path build/distribution/worker.py).Path
            & $godot.FullName --headless --path build/game --script res://_qa/npc_playtest.gd 2>&1 | Tee-Object build/windows-logs/npc.log
            if ($LASTEXITCODE -ne 0 -or !(Select-String -Path build/windows-logs/npc.log -SimpleMatch CODECITY_NPC_PLAYTEST_OK)) { throw "Native Windows NPC and story check failed" }
          }
          $output = Join-Path (Resolve-Path build/distribution).Path $env:CANDIDATE_EXE
          & $godot.FullName --headless --path build/game --export-release "Windows Candidate" $output 2>&1 | Tee-Object build/windows-logs/export.log
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output) -or !(Test-Path "$($output.Replace('.exe','.pck'))")) { throw "Windows export failed" }
          if (Select-String -Path build/windows-logs/*.log -Pattern "SCRIPT ERROR:|ERROR:") { throw "Engine errors" }
      - name: Boot standalone export outside editor project
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path (Join-Path build/distribution $env:CANDIDATE_EXE)).Path
          $log = Join-Path (Resolve-Path build/windows-logs).Path "exported-boot.log"
          $smoke = if ($env:CANDIDATE_SUITE -in @("vehicle","academy","integrated")) { "--vehicle-smoke" } else { "--smoke" }
          $marker = if ($env:CANDIDATE_SUITE -in @("vehicle","academy","integrated")) { "CODECITY_EXPORTED_VEHICLE_OK" } else { "CODECITY_FOUNDATION_SMOKE_OK" }
          $p = Start-Process -FilePath $exe -ArgumentList @("--headless","--audio-driver","Dummy","--log-file",$log,"--quit-after","360","--",$smoke) -WorkingDirectory (Resolve-Path build/distribution).Path -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Exported game boot timeout" }
          if ($p.ExitCode -ne 0 -or !(Select-String -Path $log -SimpleMatch $marker)) { throw "Exported game failed" }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR:|ERROR:") { throw "Exported game errors" }
      - name: Standalone bundled Python mission smoke
        if: inputs.suite == 'academy' || inputs.suite == 'integrated'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:CODECITY_ACADEMY_SCRIPT -ErrorAction SilentlyContinue
          Remove-Item Env:CODECITY_PYTHON -ErrorAction SilentlyContinue
          $exe=(Resolve-Path (Join-Path build/distribution $env:CANDIDATE_EXE)).Path
          $log=Join-Path (Resolve-Path build/windows-logs).Path "exported-academy.log"
          $p=Start-Process -FilePath $exe -ArgumentList @("--headless","--audio-driver","Dummy","--log-file",$log,"--","--academy-smoke") -WorkingDirectory (Resolve-Path build/distribution).Path -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Packaged Academy timeout" }
          if ($p.ExitCode -ne 0 -or !(Select-String -Path $log -SimpleMatch CODECITY_EXPORTED_ACADEMY_OK)) { throw "Packaged Python lesson failed" }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR:|ERROR:") { throw "Packaged Academy errors" }
      - name: Standalone integrated crowd and story availability smoke
        if: inputs.suite == 'integrated'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:CODECITY_NPC_SCRIPT -ErrorAction SilentlyContinue
          Remove-Item Env:CODECITY_PYTHON -ErrorAction SilentlyContinue
          $exe=(Resolve-Path (Join-Path build/distribution $env:CANDIDATE_EXE)).Path
          $log=Join-Path (Resolve-Path build/windows-logs).Path "exported-demo.log"
          $p=Start-Process -FilePath $exe -ArgumentList @("--headless","--audio-driver","Dummy","--log-file",$log,"--","--demo-smoke") -WorkingDirectory (Resolve-Path build/distribution).Path -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Packaged crowd timeout" }
          if ($p.ExitCode -ne 0 -or !(Select-String -Path $log -SimpleMatch CODECITY_EXPORTED_DEMO_OK)) { throw "Packaged crowd or story failed" }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR:|ERROR:") { throw "Packaged demo errors" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.output_artifact }}
          path: build/distribution/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-candidate-export-logs
          path: build/windows-logs/
          if-no-files-found: ignore
          retention-days: 7
