name: Publish verified Academy prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-academy-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: codecity-v0-3-0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CodeCity-Windows-Integrated-Demo-Candidate
          run-id: 45669907874
          github-token: ${{ github.token }}
          path: build/distribution
      - name: Check exact successful run and package contents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/45669907874 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/45669907874 --jq .head_sha)" = 0e70186906b2c6cb4eb4d16a1b162b08dbc766f7
          cd build/distribution
          for f in CodeCity_Academy_Demo.exe CodeCity_Academy_Demo.pck academy.py worker.py npc_brain.py python/python.exe Python-LICENSE.txt Godot-LICENSE.txt Godot-COPYRIGHT.txt THIRD_PARTY_NOTICES.md README.txt; do test -s "$f"; done
          mv CodeCity_Academy_Demo.exe CodeCity.exe
          mv CodeCity_Academy_Demo.pck CodeCity.pck
          # Console wrapper embeds the old executable name; distribute only the tested GUI binary.
          rm -f CodeCity_Academy_Demo.console.exe
          cat > README.txt <<'EOF'
          CODECITY | Living World and Academy
          Extract all files to one folder and launch CodeCity.exe.
          Living World: explore Harbor Boulevard, drive the coupe, meet Nora.
          Academy: approach the lighting cabinet, press E, select an exercise and run Python.
          WASD move, mouse camera, Shift sprint, F enter/exit vehicle, Space brake/jump, H horn, M map, Esc pause.
          Includes offline CPython. Keep Python scripts and runtime alongside the game.
          Development prerelease. Hybrid Godot and Python. Candidate art, no hardware performance guarantee.
          EOF
          zip -q -r -9 ../CodeCity_Windows_v0.3.0.zip .
          cd ..
          sha256sum CodeCity_Windows_v0.3.0.zip > SHA256SUMS.txt
      - name: Publish verified versioned public download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.3.0
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release exists; do not overwrite"; exit 0; fi
          gh release create "$tag" build/CodeCity_Windows_v0.3.0.zip build/SHA256SUMS.txt --target a259af9fd1c8d44f039a1b9a0032d4bf151730de --prerelease --title "CodeCity v0.3.0 | Living World and Academy" --notes "Automated Linux and native Windows verification passed in run 45669907874. Includes two protagonists, six Python-driven NPCs, driving, A New Beginning story, three physical Python exercises and offline CPython. Extract all files, launch CodeCity.exe. Development prerelease; no final art or target hardware approval. Includes licenses."
