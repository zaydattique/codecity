name: Publish verified Academy prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-academy-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: academy-prerelease-v0-2-0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CodeCity-Windows-Academy-Demo
          run-id: 45664681340
          github-token: ${{ github.token }}
          path: build/distribution
      - name: Check exact successful run and package contents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/45664681340 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/45664681340 --jq .head_sha)" = 74c885e8a7c066842366693c2050c00bf38dc8ff
          cd build/distribution
          for f in CodeCity_Academy_Demo.exe CodeCity_Academy_Demo.pck academy.py python/python.exe Python-LICENSE.txt Godot-LICENSE.txt Godot-COPYRIGHT.txt THIRD_PARTY_NOTICES.md README.txt; do test -s "$f"; done
          zip -q -r -9 ../CodeCity_Academy_Demo_v0.2.0.zip .
          cd ..
          sha256sum CodeCity_Academy_Demo_v0.2.0.zip > SHA256SUMS.txt
      - name: Publish verified versioned public download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.2.0-academy-demo
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release exists; do not overwrite"; exit 0; fi
          gh release create "$tag" build/CodeCity_Academy_Demo_v0.2.0.zip build/SHA256SUMS.txt --target 74c885e8a7c066842366693c2050c00bf38dc8ff --prerelease --title "CodeCity Academy Demo v0.2.0" --notes "Verified Windows x64 development build from run 45664681340. Updated camera, settings, arm motion and map, Living World driving and one actual Python lighting lesson with bundled CPython. Extract all files, launch CodeCity_Academy_Demo.exe. Hybrid Godot GDScript and Python project, not pure Python. Six visible NPCs are not included. No final graphics or hardware approval. Includes licenses."
