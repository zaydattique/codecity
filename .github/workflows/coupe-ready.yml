name: CodeCity unbranded coupe candidate
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_coupe.py'
      - '.github/workflows/coupe-ready.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch exact licensed source
        run: |
          set -euo pipefail
          mkdir -p build/coupe-input
          curl -fL --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --max-filesize 12000000 https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/e124e8d8d7330a5372bc2b4d00d39a4a9d7997ea/Models/CarConcept/glTF-Binary/CarConcept.glb -o build/coupe-input/CarConcept.glb
          echo "c272098089d78c5cd9fd9f24ff50ee8acf8d932c55f2d55fc10adb6c8998966b  build/coupe-input/CarConcept.glb" | sha256sum -c -
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render actual candidate with cockpit and wheel pivots
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/prepare_coupe.py 2>&1 | tee build/coupe-ready.log
          grep -q CODECITY_COUPE_READY_OK build/coupe-ready.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neutralized-coupe-review
          path: |
            build/coupe-ready/
            build/coupe-ready.log
          if-no-files-found: ignore
          retention-days: 7
