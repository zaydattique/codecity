name: CodeCity candidate mesh optimization
on:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_mesh_candidates.py'
      - '.github/workflows/asset-optimization.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: harbor-exteriors-not-approved
          run-id: 45596554143
          github-token: ${{ github.token }}
          path: build/optimization-artifact
      - name: Stage exact reviewed geometry
        run: |
          set -euo pipefail
          mkdir -p build/optimization-input
          cp build/optimization-artifact/street-exteriors/harbor_exteriors.blend build/optimization-input/
          curl -fL --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --max-filesize 12000000 https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/e124e8d8d7330a5372bc2b4d00d39a4a9d7997ea/Models/CarConcept/glTF-Binary/CarConcept.glb -o build/optimization-input/CarConcept.glb
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - name: Optimize street candidate and capture comparison
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/optimize_mesh_candidates.py -- street 2>&1 | tee build/optimization-street.log
          grep -q CODECITY_OPTIMIZATION_CANDIDATE_OK build/optimization-street.log
      - name: Optimize replacement car for inspection only
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/optimize_mesh_candidates.py -- coupe 2>&1 | tee build/optimization-coupe.log
          grep -q CODECITY_OPTIMIZATION_CANDIDATE_OK build/optimization-coupe.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optimized-candidates-not-approved
          path: |
            build/optimization-street/
            build/optimization-coupe/*.png
            build/optimization-coupe/report.json
            build/optimization-*.log
          if-no-files-found: ignore
          retention-days: 7
