name: CodeCity verification and asset pilot
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'ai/**'
      - 'tools/**'
      - 'tests/**'
      - 'verification/session_contract.gd'
      - 'art/**'
      - '.python-version'
      - 'pytest.ini'
      - '.github/workflows/codecity.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: codecity-main-verification
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Python tests and references
        run: |
          python --version
          python -m pip install pytest==9.0.2
          python -m pytest -q
          python tools/check_foundation.py
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Engine import and boot smoke
        run: |
          set -euo pipefail
          mkdir -p build/ci
          godot=Godot_v4.7.2-stable_linux.x86_64
          "$godot" --version | tee build/ci/godot-version.txt
          timeout 180 "$godot" --headless --path game --editor --import 2>&1 | tee build/ci/import.log
          timeout 60 "$godot" --headless --path game --quit-after 180 -- --smoke 2>&1 | tee build/ci/smoke.log
          grep -q CODECITY_FOUNDATION_SMOKE_OK build/ci/smoke.log
          mkdir -p game/_qa
          cp verification/session_contract.gd game/_qa/
          timeout 60 "$godot" --headless --path game --script res://_qa/session_contract.gd 2>&1 | tee build/ci/session.log
          grep -q CODECITY_SESSION_CONTRACT_OK build/ci/session.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/ci/import.log build/ci/smoke.log build/ci/session.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-logs
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7

  asset-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Fetch one CC0 candidate (Powered by Poly Haven)
        run: python tools/fetch_pilot_asset.py
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - name: Export and render real source
        run: |
          set -euo pipefail
          blender --version
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/render_pilot_asset.py 2>&1 | tee build/asset-pilot/render.log
          grep -q CODECITY_ASSET_PILOT_OK build/asset-pilot/render.log
          for f in bench.blend bench.glb preview.png provenance.json report.json; do test -s "build/asset-pilot/$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cc0-bench-pilot-not-approved
          path: |
            build/asset-pilot/bench.blend
            build/asset-pilot/bench.glb
            build/asset-pilot/preview.png
            build/asset-pilot/provenance.json
            build/asset-pilot/report.json
            build/asset-pilot/render.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makehumancommunity/mpfb2
          ref: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a
          path: references/mpfb2
          persist-credentials: false
      - name: Build and install pinned MPFB extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb-package"
          blender --command extension build --source-dir references/mpfb2/src/mpfb --output-dir "$RUNNER_TEMP/mpfb-package"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/mpfb-package/"*.zip)
          test "${#packages[@]}" -eq 1
          blender --command extension install-file --repo user_default --enable "${packages[0]}"
      - name: Download official CC0 system pack
        run: |
          set -euo pipefail
          python tools/fetch_system_pack.py "$RUNNER_TEMP/system-assets.zip"
          sha256sum "$RUNNER_TEMP/system-assets.zip"
      - name: Build Adrian candidate and inspect render outputs
        run: |
          set -euo pipefail
          mkdir -p build/characters
          blender --background --disable-autoexec --python-exit-code 1 --python tools/build_character.py -- --id adrian --pack "$RUNNER_TEMP/system-assets.zip" 2>&1 | tee build/characters/adrian.log
          grep -q CODECITY_CHARACTER_CANDIDATE_OK build/characters/adrian.log
          for f in adrian.blend adrian.glb front.png three_quarter.png face.png report.json; do test -s "build/characters/adrian/$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adrian-character-candidate-not-approved
          path: |
            build/characters/adrian.log
            build/characters/adrian/adrian.blend
            build/characters/adrian/adrian.glb
            build/characters/adrian/front.png
            build/characters/adrian/three_quarter.png
            build/characters/adrian/face.png
            build/characters/adrian/report.json
          if-no-files-found: ignore
          retention-days: 7
