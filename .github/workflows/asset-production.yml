name: CodeCity licensed asset production
on:
  push:
    branches: [main]
    paths:
      - 'art/characters.json'
      - 'tools/build_character.py'
      - 'tools/fetch_system_pack.py'
      - 'tools/fetch_pilot_asset.py'
      - 'tools/render_pilot_asset.py'
      - '.github/workflows/asset-production.yml'
  workflow_dispatch:
    inputs:
      character:
        description: Candidate character (no automatic approval)
        type: choice
        options: [both, adrian, maya]
        default: both
permissions:
  contents: read
concurrency:
  group: codecity-art-main
  cancel-in-progress: false
jobs:
  asset-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Fetch one CC0 candidate (Powered by Poly Haven)
        run: python tools/fetch_pilot_asset.py
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - name: Export and render real source
        run: |
          set -euo pipefail
          blender --version
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/render_pilot_asset.py 2>&1 | tee build/asset-pilot/render.log
          grep -q CODECITY_ASSET_PILOT_OK build/asset-pilot/render.log
          for f in bench.blend bench.glb preview.png provenance.json report.json; do test -s "build/asset-pilot/$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cc0-bench-pilot-not-approved
          path: |
            build/asset-pilot/bench.blend
            build/asset-pilot/bench.glb
            build/asset-pilot/preview.png
            build/asset-pilot/provenance.json
            build/asset-pilot/report.json
            build/asset-pilot/render.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makehumancommunity/mpfb2
          ref: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a
          path: references/mpfb2
          persist-credentials: false
      - name: Build and install pinned MPFB extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb-package"
          blender --command extension build --source-dir references/mpfb2/src/mpfb --output-dir "$RUNNER_TEMP/mpfb-package"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/mpfb-package/"*.zip)
          test "${#packages[@]}" -eq 1
          blender --command extension install-file --repo user_default --enable "${packages[0]}"
      - name: Download official CC0 system pack
        run: |
          set -euo pipefail
          python tools/fetch_system_pack.py "$RUNNER_TEMP/system-assets.zip"
          sha256sum "$RUNNER_TEMP/system-assets.zip"
      - name: Build selected candidate and inspect render outputs
        env:
          CHARACTER: ${{ inputs.character || 'both' }}
        run: |
          set -euo pipefail
          case "$CHARACTER" in both) characters=(adrian maya) ;; adrian|maya) characters=("$CHARACTER") ;; *) exit 2 ;; esac
          mkdir -p build/characters
          for id in "${characters[@]}"; do
            blender --background --disable-autoexec --python-exit-code 1 --python tools/build_character.py -- --id "$id" --pack "$RUNNER_TEMP/system-assets.zip" 2>&1 | tee "build/characters/$id.log"
            grep -q CODECITY_CHARACTER_CANDIDATE_OK "build/characters/$id.log"
            for f in "$id.blend" "$id.glb" front.png side.png rear.png three_quarter.png face.png report.json; do test -s "build/characters/$id/$f"; done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: character-candidate-not-approved
          path: |
            build/characters/*.log
            build/characters/*/*.blend
            build/characters/*/*.glb
            build/characters/*/*.png
            build/characters/*/report.json
          if-no-files-found: ignore
          retention-days: 7
