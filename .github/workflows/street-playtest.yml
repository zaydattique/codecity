name: CodeCity street candidate gameplay verification
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/retarget_motion.py'
      - 'verification/street_playtest.gd'
      - '.github/workflows/street-playtest.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-a-engine-review
          run-id: 45603398478
          github-token: ${{ github.token }}
          path: build/characters
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: optimized-candidates-not-approved
          run-id: 45601941130
          github-token: ${{ github.token }}
          path: build/street
      - name: Stage exact verified candidate assets outside source tree
        run: |
          set -euo pipefail
          mkdir -p build/playtest/game/candidate_assets build/playtest/game/_qa build/playtest/logs
          cp -a game/. build/playtest/game/
          cp verification/street_playtest.gd build/playtest/game/_qa/
          cp build/characters/frozen/*.glb build/playtest/game/candidate_assets/
          cp build/street/optimization-street/candidate.glb build/playtest/game/candidate_assets/street.glb
          cd build/playtest/game/candidate_assets
          echo "e5be310d7245ef986d2492f52ee003646973a92f3104294b34881dcd10681e9d  adrian.glb" | sha256sum -c -
          echo "41de3978d7d36870c1d7d7114125701085345edc56dfd27dc7d7d2333ab51c94  maya.glb" | sha256sum -c -
          echo "cbd75043c055ea6b15275670c2dd540410559a5b47c585ab4f411a3eca3529f9  street.glb" | sha256sum -c -
      - name: Acquire pinned CC0 Quaternius movement clips
        run: |
          set -euo pipefail
          mkdir -p build/motion
          curl -fL --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --max-filesize 8000000 https://raw.githubusercontent.com/webgl-games/opencity/ba9514cdd88ecc2d40ecad503a644449fc98e665/assets/characters/UAL1_Standard.glb -o build/motion/UAL1_Standard.glb
          test "$(git hash-object build/motion/UAL1_Standard.glb)" = 473e59080288428d0b6da826ba19324d07b191f0
          for id in adrian maya; do
            python -m tools.retarget_motion build/motion/UAL1_Standard.glb "build/playtest/game/candidate_assets/$id.glb" "build/motion/$id.glb"
            cp "build/motion/$id.glb" "build/playtest/game/candidate_assets/$id.glb"
          done
          cp build/motion/*.motion.json build/playtest/logs/
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import and exercise real collision and movement
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 240 "$godot" --headless --path build/playtest/game --editor --import 2>&1 | tee build/playtest/logs/import.log
          timeout 60 "$godot" --headless --path build/playtest/game --script res://_qa/street_playtest.gd -- --motion 2>&1 | tee build/playtest/logs/physics.log
          grep -q CODECITY_STREET_PLAYTEST_OK build/playtest/logs/physics.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/playtest/logs/*.log; then exit 1; fi
      - name: Render actual controller and full map
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" "$godot" --audio-driver Dummy --path build/playtest/game --rendering-method gl_compatibility --resolution 1280x720 --script res://_qa/street_playtest.gd -- --capture --motion 2>&1 | tee build/playtest/logs/render.log
          grep -q CODECITY_STREET_PLAYTEST_OK build/playtest/logs/render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/playtest/logs/*.log; then exit 1; fi
          cp build/playtest/game/_qa/*.png build/playtest/logs/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: street-playtest-evidence
          path: build/playtest/logs/
          if-no-files-found: ignore
          retention-days: 7
