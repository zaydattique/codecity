name: Phase 01 Windows and asset import verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase01-verification.yml'
      - 'verification/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-foundation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Python tests (Windows)
        run: |
          python --version
          python -m pip install pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { throw "pytest install failed" }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
          python tools/check_foundation.py
          if ($LASTEXITCODE -ne 0) { throw "static check failed" }
      - name: Verify pinned Godot archive
        run: |
          $zip = "$env:RUNNER_TEMP/godot.zip"
          curl.exe -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip -o $zip
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953") { throw "Godot archive mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP/godot"
      - name: Windows engine import and smoke
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (!$godot) { throw "Missing console engine" }
          New-Item -Force -ItemType Directory build/windows-qa | Out-Null
          & $godot.FullName --version | Tee-Object build/windows-qa/version.txt
          if ($LASTEXITCODE -ne 0) { throw "Engine version failed" }
          & $godot.FullName --headless --path game --editor --import 2>&1 | Tee-Object build/windows-qa/import.log
          if ($LASTEXITCODE -ne 0) { throw "Engine import failed" }
          & $godot.FullName --headless --path game --quit-after 180 -- --smoke 2>&1 | Tee-Object build/windows-qa/smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Engine smoke failed" }
          if (!(Select-String -Path build/windows-qa/smoke.log -Pattern "CODECITY_FOUNDATION_SMOKE_OK")) { throw "Missing success marker" }
          if (Select-String -Path build/windows-qa/*.log -Pattern "SCRIPT ERROR:|ERROR:") { throw "Engine reported errors" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-foundation-logs
          path: build/windows-qa/
          if-no-files-found: ignore
          retention-days: 7
  verified-bench-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cc0-bench-pilot-not-approved
          run-id: 45585769664
          github-token: ${{ github.token }}
          path: build/bench-source
      - name: Stage exact reviewed candidate
        run: |
          set -euo pipefail
          echo "d4fb79f8662d62fc8c720dd82c1c0ee874688e04963761fdd8439c93b441ad39  build/bench-source/bench.glb" | sha256sum -c -
          mkdir -p build/bench-project
          cp -a game/. build/bench-project/
          mkdir -p build/bench-project/_qa
          cp build/bench-source/bench.glb build/bench-project/_qa/
          cp verification/bench_import.gd build/bench-project/_qa/
      - name: Install verified Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Real mesh import and structural verification
        run: |
          set -euo pipefail
          mkdir -p build/bench-qa
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 180 "$godot" --headless --path build/bench-project --editor --import 2>&1 | tee build/bench-qa/import.log
          timeout 60 "$godot" --headless --path build/bench-project --script res://_qa/bench_import.gd 2>&1 | tee build/bench-qa/check.log
          grep -q CODECITY_BENCH_IMPORT_OK build/bench-qa/check.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/bench-qa/*.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bench-engine-import-logs
          path: build/bench-qa/
          if-no-files-found: ignore
          retention-days: 7
