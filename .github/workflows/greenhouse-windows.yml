name: BloomLogic Windows
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          run-id: 45782555245
          github-token: ${{ github.token }}
          path: runtime
      - run: python -m pip install -r requirements.txt pillow==11.3.0
      - run: python -c "from PIL import Image; Image.open('runtime/soil-nor_gl.jpg').convert('RGB').save('runtime/soil-normal.png')"
      - run: sudo apt-get update -qq && sudo apt-get install -y xdotool
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" python greenhouse.py --capture
      - name: 1080p native benchmark on Linux software graphics
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24" python greenhouse.py --benchmark --1080p
      - name: Real mouse and keyboard test on X11
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" bash tools/test_input.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Visual-Review
          path: build/runtime-review
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
          if-no-files-found: error
  windows:
    needs: runtime-render
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: pyinstaller --noconfirm --onedir --windowed --name BloomLogic --collect-all panda3d --collect-all direct --collect-all gltf --add-data "runtime;runtime" greenhouse.py
      - name: Prepare portable distribution
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md dist/BloomLogic/
          Copy-Item OPEN_GREENHOUSE.md dist/BloomLogic/README.txt
      - name: Clean extraction and blocked-network release audit
        shell: pwsh
        run: ./tools/test_release.ps1 -Revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Release-Evidence
          path: build/release-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Windows-Release
          path: build/BloomLogic-Windows.zip
          if-no-files-found: error
