name: BloomLogic Windows
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          run-id: 45719638724
          github-token: ${{ github.token }}
          path: runtime
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng xdotool
      - run: python -m tools.build_narration
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" python greenhouse.py --capture
      - name: Real mouse and keyboard test on X11
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" bash tools/test_input.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Visual-Review
          path: build/runtime-review
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
          if-no-files-found: error
  windows:
    needs: runtime-render
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: pyinstaller --noconfirm --onedir --windowed --name BloomLogic --collect-all panda3d --collect-all direct --collect-all gltf --add-data "runtime;runtime" greenhouse.py
      - name: Packaged checks with persistent diagnostics
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $env:BLOOMLOGIC_PROFILE_DIR = Join-Path $root "build\windows-diagnostics"
          $env:BLOOMLOGIC_CAPTURE_DIR = Join-Path $root "build\runtime-review"
          New-Item -ItemType Directory -Force $env:BLOOMLOGIC_PROFILE_DIR | Out-Null
          Copy-Item THIRD_PARTY_NOTICES.md dist/BloomLogic/
          Copy-Item OPEN_GREENHOUSE.md dist/BloomLogic/README.txt
          $exe = Join-Path $root "dist\BloomLogic\BloomLogic.exe"
          function Run-Check($arg, $seconds) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -WorkingDirectory $root -PassThru
            if (-not $p.WaitForExit($seconds*1000)) { $p.Kill(); Get-Content "$env:BLOOMLOGIC_PROFILE_DIR\*.log" -ErrorAction SilentlyContinue; throw "$arg timed out" }
            if ($p.ExitCode -ne 0) { Get-Content "$env:BLOOMLOGIC_PROFILE_DIR\*" -ErrorAction SilentlyContinue; throw "$arg failed: $($p.ExitCode)" }
          }
          Run-Check "--self-test" 120
          Run-Check "--gui-test" 240
      - name: Independent software graphics diagnostic on failure
        if: failure()
        shell: pwsh
        run: |
          $env:BLOOMLOGIC_PROFILE_DIR = Join-Path (Get-Location).Path "build\windows-diagnostics-safe"
          $env:BLOOMLOGIC_CAPTURE_DIR = Join-Path (Get-Location).Path "build\safe-review"
          $p = Start-Process -FilePath ".\dist\BloomLogic\BloomLogic.exe" -ArgumentList "--headless-gui-test" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Software diagnostic timed out" }
          if ($p.ExitCode -ne 0) { throw "Software diagnostic failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Windows-Diagnostics
          path: |
            build/windows-diagnostics/
            build/windows-diagnostics-safe/
            build/runtime-review/
            build/safe-review/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Windows
          path: dist/BloomLogic/
          if-no-files-found: error
