name: BloomLogic Windows
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          run-id: 45713936738
          github-token: ${{ github.token }}
          path: runtime
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: licensed-greenhouse-prop-sources
          run-id: 45699394380
          github-token: ${{ github.token }}
          path: runtime/props
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" python greenhouse.py --capture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Visual-Review
          path: build/runtime-review
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
          if-no-files-found: error
  windows:
    needs: runtime-render
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BloomLogic-Runtime-Assets
          path: runtime
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python greenhouse.py --self-test
      - run: pyinstaller --noconfirm --onedir --windowed --name BloomLogic --collect-all panda3d --collect-all direct --collect-all gltf --add-data "runtime;runtime" greenhouse.py
      - shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md dist/BloomLogic/
          Copy-Item OPEN_GREENHOUSE.md dist/BloomLogic/README.txt
          $p = Start-Process -FilePath ".\dist\BloomLogic\BloomLogic.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Packaged asset smoke test timed out" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\BloomLogic\startup-error.txt" -ErrorAction SilentlyContinue; throw "Packaged smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BloomLogic-Windows
          path: dist/BloomLogic/
          if-no-files-found: error
      - name: Test packaged GUI without blocking on error dialog
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\BloomLogic\BloomLogic.exe" -ArgumentList "--gui-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Packaged GUI test timed out" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\BloomLogic\startup-error.txt" -ErrorAction SilentlyContinue; throw "Packaged GUI test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Windows-Visual-Review
          path: build/runtime-review
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BloomLogic-Windows-Diagnostics
          path: ${{ env.LOCALAPPDATA }}/BloomLogic/*.txt
          if-no-files-found: ignore
