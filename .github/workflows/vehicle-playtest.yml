name: CodeCity actual vehicle candidate verification
on:
  workflow_run:
    workflows: ["CodeCity unbranded coupe candidate"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'game/core/street_vehicle.gd'
      - 'game/core/street_player.gd'
      - 'game/scenes/harbor_playtest.gd'
      - 'verification/vehicle_playtest.gd'
      - '.github/workflows/vehicle-playtest.yml'
  workflow_dispatch:
    inputs:
      coupe_run:
        description: Completed coupe candidate run ID
        required: true
        default: '45629610589'
permissions:
  contents: read
  actions: read
jobs:
  vehicle:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-street-project-candidate
          run-id: 45622243827
          github-token: ${{ github.token }}
          path: build/street-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: neutralized-coupe-review
          run-id: ${{ github.event.workflow_run.id || inputs.coupe_run || '45629610589' }}
          github-token: ${{ github.token }}
          path: build/coupe-input
      - name: Stage reviewed candidate street and exact neutralized coupe
        run: |
          set -euo pipefail
          mkdir -p build/previous build/vehicle-game build/evidence
          tar -xzf build/street-input/tested-project.tar.gz -C build/previous
          cp -a game/. build/vehicle-game/
          mkdir -p build/vehicle-game/candidate_assets build/vehicle-game/_qa
          cp build/previous/game/candidate_assets/{adrian,maya,street}.glb build/vehicle-game/candidate_assets/
          cp verification/vehicle_playtest.gd verification/street_playtest.gd build/vehicle-game/_qa/
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          folder=Path("build/coupe-input/coupe-ready")
          r=json.loads((folder/"report.json").read_text())
          glb=folder/"coupe.glb"
          assert r["source_sha256"]=="c272098089d78c5cd9fd9f24ff50ee8acf8d932c55f2d55fc10adb6c8998966b"
          assert r["license"]=="CC-BY-4.0" and 30000<=r["triangles_after"]<=60000
          assert set(r["wheels"])=={"FL","FR","RL","RR"}
          assert all(0.24<=w["radius"]<=0.49 for w in r["wheels"].values())
          assert hashlib.sha256(glb.read_bytes()).hexdigest()==r["glb_sha256"]
          shutil.copy2(glb,"build/vehicle-game/candidate_assets/coupe.glb")
          shutil.copy2(folder/"report.json","build/evidence/coupe-report.json")
          PY
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Real geometry import and deterministic drive test
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 240 "$godot" --headless --path build/vehicle-game --editor --import 2>&1 | tee build/evidence/import.log
          timeout 90 "$godot" --headless --path build/vehicle-game --script res://_qa/vehicle_playtest.gd 2>&1 | tee build/evidence/vehicle.log
          grep -q CODECITY_VEHICLE_PLAYTEST_OK build/evidence/vehicle.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/evidence/*.log; then exit 1; fi
      - name: Render driving and safe exit
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" "$godot" --audio-driver Dummy --path build/vehicle-game --rendering-method gl_compatibility --resolution 1280x720 --script res://_qa/vehicle_playtest.gd -- --capture 2>&1 | tee build/evidence/render.log
          grep -q CODECITY_VEHICLE_PLAYTEST_OK build/evidence/render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/evidence/*.log; then exit 1; fi
          cp build/vehicle-game/_qa/*.png build/evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-vehicle-playtest-evidence
          path: build/evidence/
          if-no-files-found: ignore
          retention-days: 7
