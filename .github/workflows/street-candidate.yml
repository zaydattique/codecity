name: CodeCity street art candidate
on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_street_sources.py'
      - 'tools/build_street_candidate.py'
      - '.github/workflows/street-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  street:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Acquire actual licensed sources
        run: python -m tools.fetch_street_sources
      - name: Install pinned Blender LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          file=blender-4.5.17-linux-x64.tar.xz
          downloaded=false
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            if curl -fsSL --retry 2 --max-time 60 "$base/blender-4.5.17.sha256" -o blender-checksums && curl -fsSL --retry 2 --max-time 600 "$base/$file" -o "$file"; then
              grep -E "^[[:xdigit:]]{64} [ *]$file$" blender-checksums | sha256sum -c -
              downloaded=true
              break
            fi
            rm -f "$file" blender-checksums
          done
          test "$downloaded" = true
          tar -xJf "$file"
          echo "$RUNNER_TEMP/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render street surface and facade kit
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python tools/build_street_candidate.py 2>&1 | tee build/street.log
          grep -q CODECITY_STREET_SURFACE_CANDIDATE_OK build/street.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: street-art-candidate-not-approved
          path: |
            build/street.log
            build/street-candidate/*.blend
            build/street-candidate/*.glb
            build/street-candidate/*.png
            build/street-candidate/*.json
          if-no-files-found: ignore
          retention-days: 7
