name: CodeCity six NPC actual world verification
on:
  push:
    branches: [main]
    paths:
      - 'game/core/npc_bridge.gd'
      - 'game/core/npc_director.gd'
      - 'game/core/street_npc.gd'
      - 'verification/npc_playtest.gd'
      - '.github/workflows/npc-playtest.yml'
  workflow_run:
    workflows: ["CodeCity six civilian art candidates"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      cast_run:
        description: Successful six-cast build run ID
        required: true
        default: '45666586177'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-vehicle-project-candidate
          run-id: 45664681340
          github-token: ${{ github.token }}
          path: build/prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: npc-*-candidate
          run-id: ${{ github.event.workflow_run.id || inputs.cast_run || '45666586177' }}
          github-token: ${{ github.token }}
          path: build/cast
      - name: Stage exact distinct actual model outputs
        run: |
          set -euo pipefail
          mkdir -p build/previous build/npc-game build/evidence
          tar -xzf build/prior/tested-project.tar.gz -C build/previous
          cp -a game/. build/npc-game/
          mkdir -p build/npc-game/candidate_assets build/npc-game/_qa
          cp build/previous/game/candidate_assets/*.glb build/npc-game/candidate_assets/
          cp verification/npc_playtest.gd build/npc-game/_qa/
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          seen=set()
          for id in ("nora","omar","elena","marcus","sana","liam"):
              folder=Path(f"build/cast/npc-{id}-candidate/{id}")
              report=json.loads((folder/"report.json").read_text())
              motion=json.loads((folder/"runtime.motion.json").read_text())
              glb=folder/"runtime.glb"
              digest=hashlib.sha256(glb.read_bytes()).hexdigest()
              assert report["profile"]==id and report["bones"]==53
              assert report["source_license"]=="CC0-1.0"
              assert 5000<=report["triangles"]<=100000
              assert digest==motion["output_sha256"] and digest not in seen
              seen.add(digest)
              shutil.copy2(glb,f"build/npc-game/candidate_assets/npc_{id}.glb")
              shutil.copy2(folder/"report.json",f"build/evidence/{id}.json")
          PY
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Actual six-actor Python runtime regression
        env:
          CODECITY_NPC_SCRIPT: ${{ github.workspace }}/ai/worker.py
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 240 "$godot" --headless --path build/npc-game --editor --import 2>&1 | tee build/evidence/import.log
          timeout 90 "$godot" --headless --path build/npc-game --script res://_qa/npc_playtest.gd 2>&1 | tee build/evidence/npc.log
          grep -q CODECITY_NPC_PLAYTEST_OK build/evidence/npc.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/evidence/*.log; then exit 1; fi
      - name: Render actual populated street
        env:
          CODECITY_NPC_SCRIPT: ${{ github.workspace }}/ai/worker.py
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" "$godot" --audio-driver Dummy --path build/npc-game --rendering-method gl_compatibility --resolution 1280x720 --script res://_qa/npc_playtest.gd -- --capture 2>&1 | tee build/evidence/render.log
          grep -q CODECITY_NPC_PLAYTEST_OK build/evidence/render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/evidence/render.log; then exit 1; fi
          cp build/npc-game/_qa/*.png build/evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npc-world-review-evidence
          path: build/evidence/
          if-no-files-found: ignore
          retention-days: 7
