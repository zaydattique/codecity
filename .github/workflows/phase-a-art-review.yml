name: CodeCity Phase A actual art import and render
on:
  push:
    branches: [main]
    paths:
      - 'verification/phase_a_asset_review.gd'
      - '.github/workflows/phase-a-art-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: character-candidate-not-approved
          run-id: 45596829649
          github-token: ${{ github.token }}
          path: build/character-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: optimized-candidates-not-approved
          run-id: 45601941130
          github-token: ${{ github.token }}
          path: build/street-input
      - name: Stage exact reviewed GLBs
        run: |
          set -euo pipefail
          mkdir -p build/review-game/_qa build/review-evidence
          cp -a game/. build/review-game/
          cp verification/phase_a_asset_review.gd build/review-game/_qa/
          cp build/character-input/adrian/adrian.glb build/review-game/_qa/adrian.glb
          cp build/character-input/maya/maya.glb build/review-game/_qa/maya.glb
          cp build/street-input/optimization-street/candidate.glb build/review-game/_qa/street.glb
          cd build/review-game/_qa
          echo "c2c5c5425b03133f0dc995fb1c7d6cc3788b4df7d0dbfcac050658e1bb1503e1  adrian.glb" | sha256sum -c -
          echo "fa575b54117955bb5095ed8fd7fbf91318f436160193456e8e69ce82960482ee  maya.glb" | sha256sum -c -
          echo "cbd75043c055ea6b15275670c2dd540410559a5b47c585ab4f411a3eca3529f9  street.glb" | sha256sum -c -
      - name: Freeze default character morphs for runtime import
        run: |
          set -euo pipefail
          mkdir -p build/frozen
          python tools/freeze_character_morphs.py build/review-game/_qa/adrian.glb build/frozen/adrian.glb
          python tools/freeze_character_morphs.py build/review-game/_qa/maya.glb build/frozen/maya.glb
          cp build/frozen/*.glb build/review-game/_qa/
          sha256sum build/frozen/*.glb | tee build/review-evidence/frozen-sha256.txt
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 300 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import and verify actual geometry
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 240 "$godot" --headless --path build/review-game --editor --import 2>&1 | tee build/review-evidence/import.log
          timeout 60 "$godot" --headless --path build/review-game --script res://_qa/phase_a_asset_review.gd 2>&1 | tee build/review-evidence/structure.log
          grep -q CODECITY_REAL_ASSET_IMPORT_OK build/review-evidence/structure.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/review-evidence/*.log; then exit 1; fi
      - name: Actual engine rendered review using software OpenGL
        run: |
          set -euo pipefail
          command -v xvfb-run
          godot="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" "$godot" --path build/review-game --rendering-method gl_compatibility --resolution 1280x720 --script res://_qa/phase_a_asset_review.gd -- --render-review 2>&1 | tee build/review-evidence/render.log
          grep -q CODECITY_REAL_RENDER_REVIEW_OK build/review-evidence/render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/review-evidence/render.log; then exit 1; fi
          cp build/review-game/_qa/*_review.png build/review-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-a-engine-review
          path: |
            build/review-evidence/
            build/frozen/
          if-no-files-found: ignore
          retention-days: 7
