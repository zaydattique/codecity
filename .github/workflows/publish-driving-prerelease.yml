name: Publish verified driving prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-driving-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: driving-prerelease-v0-1-0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CodeCity-Windows-Driving-Test
          run-id: 45631491513
          github-token: ${{ github.token }}
          path: build/distribution
      - name: Verify exact previously tested binaries and preserve notices
        run: |
          set -euo pipefail
          cd build/distribution
          echo "d34d36f3be1a6c49c56525ae86469b92e4f417ddf0b43cf00dd80c385c4b0562  CodeCity_Driving_Test.exe" | sha256sum -c -
          echo "4a2e407aeec11320fcf770d2ff4ff6e22b43c64fa0fedf0032ef31be258ea43f  CodeCity_Driving_Test.pck" | sha256sum -c -
          for f in README.txt THIRD_PARTY_NOTICES.md Godot-LICENSE.txt Godot-COPYRIGHT.txt coupe-report.json; do test -s "$f"; done
          zip -9 ../CodeCity_Driving_Test_v2.zip CodeCity_Driving_Test.exe CodeCity_Driving_Test.pck README.txt THIRD_PARTY_NOTICES.md Godot-LICENSE.txt Godot-COPYRIGHT.txt coupe-report.json
          cd ..
          sha256sum CodeCity_Driving_Test_v2.zip > SHA256SUMS.txt
      - name: Publish stable public download URL for this development candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.0-driving-test
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace previously published files."
            exit 0
          fi
          gh release create "$tag" build/CodeCity_Driving_Test_v2.zip build/SHA256SUMS.txt --target e89579880cfff4586718b3cb0129d2c620998da6 --prerelease --title "CodeCity Driving Test v2" --notes "Development candidate for Windows x64. Extract all files together and launch CodeCity_Driving_Test.exe. No installation or GitHub login required for the public download. Includes two protagonists, one street, movement and driving. NPCs, missions, interiors, save and Academy execution are not included. Unsigned development executable; not a final game. Exact previously verified binaries from Actions run 45631491513. Third-party and engine notices included."
